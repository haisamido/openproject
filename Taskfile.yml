version: "3"

vars:
  COMPOSE_FILE: compose.yaml
  SERVICE: openproject

tasks:
  up:
    desc: Start OpenProject in the background
    cmd: docker compose -f {{.COMPOSE_FILE}} up -d

  down:
    desc: Stop and remove containers
    cmd: docker compose -f {{.COMPOSE_FILE}} down

  start:
    desc: Start existing (stopped) containers
    cmd: docker compose -f {{.COMPOSE_FILE}} start

  stop:
    desc: Stop running containers without removing them
    cmd: docker compose -f {{.COMPOSE_FILE}} stop

  restart:
    desc: Restart containers
    cmd: docker compose -f {{.COMPOSE_FILE}} restart

  logs:
    desc: Follow container logs
    cmd: docker compose -f {{.COMPOSE_FILE}} logs -f {{.SERVICE}}

  ps:
    desc: Show container status
    cmd: docker compose -f {{.COMPOSE_FILE}} ps

  shell:
    desc: Open a bash shell in the container
    cmd: docker compose -f {{.COMPOSE_FILE}} exec {{.SERVICE}} bash

  pull:
    desc: Pull the latest image
    cmd: docker compose -f {{.COMPOSE_FILE}} pull

  destroy:
    desc: Stop containers and remove volumes
    cmd: docker compose -f {{.COMPOSE_FILE}} down -v
